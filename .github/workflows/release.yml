#  稳定版发布
#
#  触发：推送 v* 标签，例如
#        git tag v1.0.1
#        git push origin v1.0.1
#  产物：安装器 + 便携版，发布为正式 Release（非预发布，自动标记 Latest）
#  版本：取自 installer/pdfboard.iss 的 AppVersion，且**必须与标签一致**，
#        不一致直接失败——否则会发出版本号与内容错位的包。
#
#  发布说明里的"本版变更"是给当前这一版写的，发新版时记得同步改写。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write               # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
      INNO_DIR: "C:\\Program Files (x86)\\Inno Setup 6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 标签 v1.0.1 对应 AppVersion 1.0.1（安装器文件名与"应用和功能"里的版本都来自它）。
      - name: Check version against tag
        id: ver
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $base = (Select-String -Path installer/pdfboard.iss -Pattern 'AppVersion\s+"([\d.]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$base") {
            throw "标签 $tag 与 installer/pdfboard.iss 的 AppVersion=$base 不一致：请先同步版本号（pdfboard.iss + assets/app.rc）再打标签"
          }
          "version=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # 代码签名是可选步骤：配置了签名密钥才执行，没配置就跳过（fork 不会因此失败）。
      # 注意：secrets 不能直接写在 if 里，所以先探测再输出布尔值。
      - name: Detect signing secrets
        id: signing
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX) { "enabled=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT }
          else          { "enabled=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qtpdf
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # runner 的 PATH 里 MinGW 排在前面，CMake 会误选 g++ 去链接 MSVC 版 Qt。
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Stage runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item build/pdfboard.exe dist/stage/
          # 不打包 vc_redist：按当前用户安装（不弹 UAC）本来也装不了它；
          # 不打包全部翻译：只随包附上本程序使用的简体中文。
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations `
              --no-system-d3d-compiler dist/stage/pdfboard.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Remove-Item dist/stage/dxcompiler.dll, dist/stage/dxil.dll, dist/stage/vc_redist.x64.exe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist/stage/translations | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/translations/*zh_CN.qm" dist/stage/translations/ -ErrorAction SilentlyContinue

      # 出门前的门禁：确定性自测（在 dist/stage 里跑，Qt 运行库就在旁边，不依赖 runner 的 PATH）
      - name: Self test
        shell: pwsh
        run: |
          & dist/stage/pdfboard.exe --selftest-log
          if ($LASTEXITCODE -ne 0) { throw "self test failed" }

      - name: Sign app executable (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASS: ${{ secrets.SIGN_PFX_PASS }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASS `
                           /tr http://timestamp.digicert.com /td SHA256 dist/stage/pdfboard.exe
          if ($LASTEXITCODE -ne 0) { throw "signing the app failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path $env:INNO_DIR "ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer/pdfboard.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item "dist/PDFBoard-${{ steps.ver.outputs.version }}-setup.exe" |
            ForEach-Object { "installer: {0:N1} MB" -f ($_.Length / 1MB) }

      - name: Sign installer (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASS: ${{ secrets.SIGN_PFX_PASS }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASS `
                           /tr http://timestamp.digicert.com /td SHA256 `
                           "dist/PDFBoard-${{ steps.ver.outputs.version }}-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing the installer failed" }

      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item dist/stage/* dist/portable -Recurse -Force
          $note = @"
          大屏 PDF 批注 — 便携版 $ver

          1) 解压到任意文件夹，直接运行 pdfboard.exe，无需安装。
          2) 需要 Windows 10/11 64 位；Qt 运行库已随包附带。
          3) 文件关联可在应用内「设置 → 文件关联」一键注册。
          4) 未做代码签名：SmartScreen 提示时选「更多信息 → 仍要运行」。

          版本：$ver    构建时间：$(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC
          "@
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist/portable) "便携版说明.txt"),
                                          $note, (New-Object System.Text.UTF8Encoding($true)))
          Compress-Archive -Path "dist/portable/*" -DestinationPath "dist/PDFBoard-$ver-portable.zip" -Force
          Get-Item "dist/PDFBoard-$ver-portable.zip" |
            ForEach-Object { "portable: {0:N1} MB" -f ($_.Length / 1MB) }

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }} — 大屏 PDF 批注"
          prerelease: false
          draft: false
          make_latest: true
          generate_release_notes: true      # 从提交记录自动生成变更列表
          files: |
            dist/PDFBoard-${{ steps.ver.outputs.version }}-setup.exe
            dist/PDFBoard-${{ steps.ver.outputs.version }}-portable.zip
          body: |
            **大屏 PDF 批注 v${{ steps.ver.outputs.version }}** — 面向教室大屏一体机的 PDF 查看 + 手写批注（原生 C++/Qt6，触控与低内存优化）。

            | 下载 | 说明 |
            |---|---|
            | `PDFBoard-${{ steps.ver.outputs.version }}-setup.exe` | 安装版：注册到「应用和功能」，支持静默部署 `/VERYSILENT /SUPPRESSMSGBOXES /NORESTART` |
            | `PDFBoard-${{ steps.ver.outputs.version }}-portable.zip` | 便携版：解压即用，不写系统 |

            需要 Windows 10/11 64 位；Qt 运行库已随包附带。
            未做代码签名，SmartScreen 提示时选「更多信息 → 仍要运行」即可。

            **校验**：构建前跑过 `--selftest-log` 自测门禁；提交 `${{ github.sha }}`。
